name: Android release build

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip
          mv cmdline-tools latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Node & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JS deps
        run: |
          yarn install --frozen-lockfile

      - name: Decode keystore (from secrets)
        if: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > XPixelNative/android/key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write keystore properties
        if: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cat > XPixelNative/android/keystore.properties <<EOF
          storeFile=../key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Android release
        run: |
          cd XPixelNative/android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon

      - name: Compute checksum and write metadata
        run: |
          mkdir -p apps/web/public/downloads
          APK=XPixelNative/android/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES}/1024/1024}")
          LAST_MOD=$(date -u -Iseconds -r "$APK")
          cat > apps/web/public/downloads/xpixel-android.json <<JSON
          {
            "filename": "xpixel-android.apk",
            "sizeBytes": $SIZE_BYTES,
            "sizeMB": $SIZE_MB,
            "lastModified": "$LAST_MOD",
            "sha256": "$SHA"
          }
          JSON

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpixel-android-apk
          path: XPixelNative/android/app/build/outputs/apk/release/app-release.apk

      - name: Commit metadata back to repo (optional)
        if: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/downloads/xpixel-android.json
          git commit -m "chore(release): add apk metadata [skip ci]" || echo "no changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

*** End Patch